[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "PIE"]
ignore = [
  "S105", "S106",  # hardcoded-password checks - false-positive on non-secret fields
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the correct tool in test files

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
